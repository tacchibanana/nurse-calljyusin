<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理・受信ボード - nursecallAPP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #fdfaf5;
            --card-bg: #ffffff;
            --text-color: #3e3a39;
            --primary-color: #5d627b;
            --accent-red: #d9534f;
            --accent-orange: #f0ad4e;
            --accent-green: #5cb85c;
            --tab-bg: #e9e4d9;
            --border-color: #dcd6c8;
        }

        body.night-mode {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --tab-bg: #333333;
            --border-color: #444444;
            --primary-color: #8fa1cc;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            transition: background-color 0.3s;
        }

        /* --- ヘッダー --- */
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--tab-bg); padding: 5px 20px; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: transparent; cursor: pointer; font-size: 1.4rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; color: var(--text-color);
        }
        .icon-btn.active { background: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        
        .stop-alarm-btn {
            display: none; width: 45px; height: 45px; border-radius: 50%;
            background: #e60012; color: white; border: none; font-size: 1.4rem;
            cursor: pointer; animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .night-toggle { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-color); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }

        .content-section { display: none; padding: 20px; }
        .content-section.active { display: block; }

        /* 受信カード */
        .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 10px solid #ccc; }
        .card.urgent { border-left-color: var(--accent-red); }
        .card.normal { border-left-color: var(--accent-orange); }
        .card.consult { border-left-color: var(--accent-green); }
        .priority-badge { font-size: 0.9rem; font-weight: bold; padding: 4px 8px; border-radius: 5px; }
        .badge-urgent { background: #ffebeb; color: var(--accent-red); }
        .badge-normal { background: #fff8eb; color: var(--accent-orange); }
        .badge-consult { background: #eff8ef; color: var(--accent-green); }
        .done-btn { width: 100%; margin-top: 15px; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* QR一覧 */
        .qr-stock-title { margin-top: 40px; border-top: 2px dashed var(--border-color); padding-top: 20px; font-size: 1.3rem; }
        .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .qr-stock-card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .qr-stock-card h4 { margin: 0 0 5px 0; font-size: 1.4rem; color: var(--primary-color); }
        .qr-stock-card p { margin: 0 0 10px 0; font-size: 0.9rem; color: #777; }
        .mini-print-btn { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem; }

        /* 設定画面 */
        .settings-group { margin-bottom: 25px; background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .settings-group label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.95rem; }
        .settings-group select, .settings-group input[type="range"] { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; font-size: 1rem; }
        .test-btn { margin-top: 15px; padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* --- 印刷用 --- */
        #print-area { display: none; }
        @media print {
            @page { size: A4 portrait; margin: 0mm; }
            body { -webkit-print-color-adjust: exact; margin: 0; }
            .no-print { display: none !important; }
            #print-area { display: block !important; width: 210mm; height: 297mm; padding: 15mm; box-sizing: border-box; background: white; color: black; }
            .print-container { border: 2px solid #eee; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10mm; box-sizing: border-box; }
            .step-num { background: #d9534f !important; color: white !important; }
            .instructions { padding: 25px; border-radius: 20px; text-align: left; background: #f9f9f9; border: 2px dashed #ccc; }
            .step { display: flex; align-items: center; margin-bottom: 20px; }
            .step-num { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: bold; margin-right: 20px; }
            .step-text { font-size: 1.6rem; font-weight: bold; }
        }

        #start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .start-btn { padding: 20px 40px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; background: var(--primary-color); color: white; border: none; }
    </style>
</head>
<body>

<div id="print-area">
    <div class="print-container">
        <div style="text-align:center;">
            <p style="font-size: 1.4rem;">スマホでコール</p>
            <h1 style="font-size:4.5rem; margin:10px 0;" id="out-room">---</h1>
            <p id="out-name" style="font-size: 2rem;"></p>
            <div id="qrcode" style="display:flex; justify-content:center; margin:30px 0;"></div>
            <div class="instructions">
                <h2 style="text-align:center; color:#d9534f; margin-bottom:25px;">つかいかた</h2>
                <div class="step"><div class="step-num">1</div><div class="step-text">カメラでQRを読み取る</div></div>
                <div class="step"><div class="step-num">2</div><div class="step-text">今の状況と用件をえらぶ</div></div>
                <div class="step"><div class="step-num">3</div><div class="step-text">「スタッフを呼ぶ」をおす</div></div>
            </div>
        </div>
    </div>
</div>

<div class="no-print">
    <div id="start-overlay">
        <button class="start-btn" onclick="startApp()">受信を開始する</button>
    </div>

    <div class="header-bar">
        <div class="nav-icons">
            <button class="icon-btn active" id="btn-board" onclick="switchTab('board-section', this)">📋</button>
            <button class="icon-btn" id="btn-qr" onclick="switchTab('qr-section', this)">➕</button>
            <button class="icon-btn" id="btn-settings" onclick="switchTab('settings-section', this)">⚙️</button>
        </div>
        <div class="header-controls">
            <button id="stop-alarm-btn" class="stop-alarm-btn" onclick="stopAlarm()">🔕</button>
            <button class="night-toggle" onclick="toggleNightMode()">🌙</button>
        </div>
    </div>

    <div id="board-section" class="content-section active">
        <div class="board" id="board"></div>
    </div>

    <div id="qr-section" class="content-section">
        <div style="max-width: 600px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2>QRコード新規作成</h2>
            <input type="text" id="in-room" placeholder="部屋番号 (例: 205-A)" style="width:100%; padding:12px; margin-bottom:12px; box-sizing:border-box; font-size:1rem;">
            <input type="text" id="in-name" placeholder="お名前（任意 例: 山田）" style="width:100%; padding:12px; margin-bottom:12px; box-sizing:border-box; font-size:1rem;">
            <input type="hidden" id="sender-url" value="https://tacchibanana.github.io/nurse-callsosin/">
            <button class="done-btn" onclick="generateAndRegister()" style="background:#007bff; margin-bottom:10px;">✨ 一覧に追加して印刷用データを作る</button>
            <h3 class="qr-stock-title">📦 作成済みQRコード一覧 (区別・再印刷用)</h3>
            <div class="qr-grid" id="qr-stock-list"></div>
        </div>
    </div>

    <div id="settings-section" class="content-section">
        <div style="max-width: 600px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2>⚙️ 音声・通知設定</h2>
            
            <div class="settings-group">
                <h3 style="color: var(--accent-red); margin-top:0;">🚨 緊急アラーム (すぐ来て)</h3>
                <label>音の種類:</label>
                <select id="urgent-sound" onchange="updateAudioSettings()">
                    <option value="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3">激しいアラーム (デフォルト)</option>
                    <option value="https://assets.mixkit.co/active_storage/sfx/2861/2861-preview.mp3">電子音アラーム (ピッピッピッ)</option>
                    <option value="https://assets.mixkit.co/active_storage/sfx/1008/1008-preview.mp3">警告音 (ブーブー)</option>
                </select>
                <label>音量:</label>
                <input type="range" id="urgent-volume" min="0" max="1" step="0.1" value="1" onchange="updateAudioSettings()">
                <button class="test-btn" onclick="testAudio('urgent')">▶️ テスト再生（3秒間）</button>
            </div>

            <div class="settings-group">
                <h3 style="color: var(--accent-orange); margin-top:0;">🟡 通常チャイム (急がない / 相談)</h3>
                <label>音の種類:</label>
                <select id="normal-sound" onchange="updateAudioSettings()">
                    <option value="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">ピンポーン (デフォルト)</option>
                    <option value="https://assets.mixkit.co/active_storage/sfx/1131/1131-preview.mp3">やさしい通知音 (ポーン)</option>
                    <option value="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3">軽快なチャイム (ティロリン)</option>
                </select>
                <label>音量:</label>
                <input type="range" id="normal-volume" min="0" max="1" step="0.1" value="1" onchange="updateAudioSettings()">
                <button class="test-btn" onclick="testAudio('normal')">▶️ テスト再生</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, query, orderBy, onSnapshot, 
        deleteDoc, doc, limit, initializeFirestore 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBeL7xd049PjR-Sl18C-EJ2HgCkjzKI0SM",
        authDomain: "nursecallapp-bac29.firebaseapp.com",
        projectId: "nursecallapp-bac29",
        storageBucket: "nursecallapp-bac29.firebasestorage.app",
        messagingSenderId: "690697442852",
        appId: "1:690697442852:web:75b17f1abc8b7b20f6aab1"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });

    // --- 音声設定の読み込みと適用 ---
    const savedUrgentSound = localStorage.getItem('urgentSound') || 'https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3';
    const savedUrgentVolume = localStorage.getItem('urgentVolume') !== null ? localStorage.getItem('urgentVolume') : 1;
    const savedNormalSound = localStorage.getItem('normalSound') || 'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3';
    const savedNormalVolume = localStorage.getItem('normalVolume') !== null ? localStorage.getItem('normalVolume') : 1;

    const urgentAudio = new Audio(savedUrgentSound);
    urgentAudio.loop = true;
    urgentAudio.volume = savedUrgentVolume;

    const normalAudio = new Audio(savedNormalSound);
    normalAudio.volume = savedNormalVolume;

    // UIに保存された値をセット
    document.getElementById('urgent-sound').value = savedUrgentSound;
    document.getElementById('urgent-volume').value = savedUrgentVolume;
    document.getElementById('normal-sound').value = savedNormalSound;
    document.getElementById('normal-volume').value = savedNormalVolume;

    window.updateAudioSettings = () => {
        const uS = document.getElementById('urgent-sound').value;
        const uV = document.getElementById('urgent-volume').value;
        const nS = document.getElementById('normal-sound').value;
        const nV = document.getElementById('normal-volume').value;

        urgentAudio.src = uS; urgentAudio.volume = uV;
        normalAudio.src = nS; normalAudio.volume = nV;

        localStorage.setItem('urgentSound', uS);
        localStorage.setItem('urgentVolume', uV);
        localStorage.setItem('normalSound', nS);
        localStorage.setItem('normalVolume', nV);
    };

    window.testAudio = (type) => {
        if (type === 'urgent') {
            urgentAudio.currentTime = 0;
            urgentAudio.play().catch(()=>{});
            setTimeout(() => { urgentAudio.pause(); urgentAudio.currentTime = 0; }, 3000);
        } else {
            normalAudio.currentTime = 0;
            normalAudio.play().catch(()=>{});
        }
    };

    let qrStockData = [];

    // --- UI用関数群 ---
    window.toggleNightMode = () => document.body.classList.toggle('night-mode');
    
    window.switchTab = (id, el) => {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    };

    window.stopAlarm = () => {
        urgentAudio.pause(); urgentAudio.currentTime = 0;
        document.getElementById('stop-alarm-btn').style.display = 'none';
    };

    window.generateAndRegister = () => {
        const room = document.getElementById('in-room').value.trim();
        const name = document.getElementById('in-name').value.trim();
        if (!room) return alert("部屋番号を入力してください");

        const exists = qrStockData.some(item => item.room === room);
        if (!exists) {
            qrStockData.push({ room, name });
            updateStockListUI();
        }
        window.preparePrint(room, name);
        document.getElementById('in-room').value = "";
        document.getElementById('in-name').value = "";
    };

    function updateStockListUI() {
        const listContainer = document.getElementById('qr-stock-list');
        listContainer.innerHTML = "";
        qrStockData.forEach(item => {
            const stockCard = document.createElement('div');
            stockCard.className = 'qr-stock-card';
            stockCard.innerHTML = `
                <h4>🚪 ${item.room}</h4>
                <p>${item.name ? '👤 ' + item.name + ' 様' : '（名前なし）'}</p>
                <button class="mini-print-btn" onclick="preparePrint('${item.room}', '${item.name}')">🖨️ 印刷</button>
            `;
            listContainer.appendChild(stockCard);
        });
    }

    window.preparePrint = (room, name) => {
        document.getElementById('out-room').innerText = room;
        document.getElementById('out-name').innerText = name ? name + " 様" : "";
        const baseUrl = document.getElementById('sender-url').value;
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        const finalUrl = `${baseUrl}?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`;
        new QRCode(qrContainer, { text: finalUrl, width: 250, height: 250 });
        setTimeout(() => window.print(), 600);
    };

    window.completeCall = async (id) => {
        if(confirm("対応完了として削除しますか？")) {
            await deleteDoc(doc(db, "calls", id));
            stopAlarm();
        }
    };

    // --- デスクトップ通知を送信する関数 ---
    function sendDesktopNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body });
        }
    }

    // --- スリープ防止（常時点灯）処理 ---
    let wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('スリープ防止が有効になりました');
            }
        } catch (err) {
            console.warn(`スリープ防止機能の起動に失敗しました: ${err.message}`);
        }
    }

    // 別のアプリからブラウザに戻ってきたときにスリープ防止を再適用する
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    // --- メイン受信処理 ---
    window.startApp = async () => {
        document.getElementById('start-overlay').style.display = 'none';

        // 受信開始時にスリープ防止を要求
        await requestWakeLock();

        // 受信開始時にバックグラウンド通知の許可をブラウザにリクエスト
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        const q = query(collection(db, "calls"), orderBy("createdAt", "desc"), limit(300));
        
        onSnapshot(q, { includeMetadataChanges: false }, (snapshot) => {
            const board = document.getElementById('board');
            
            snapshot.docChanges().forEach((change) => {
                const data = change.doc.data();
                const id = change.doc.id;

                if (change.type === "added") {
                    const card = document.createElement('div');
                    card.className = `card ${data.priority}`;
                    card.id = `card-${id}`;

                    let badgeHtml = "";
                    if (data.priority === 'urgent') badgeHtml = '<span class="priority-badge badge-urgent">🚨 緊急</span>';
                    else if (data.priority === 'normal') badgeHtml = '<span class="priority-badge badge-normal">🟡 急がない</span>';
                    else if (data.priority === 'consult') badgeHtml = '<span class="priority-badge badge-consult">🟢 相談</span>';

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="font-size:1.6rem; font-weight:bold;">${data.room}</div>
                            <div>${badgeHtml}</div>
                        </div>
                        <div style="margin:15px 0; font-size:1.3rem; font-weight:bold; color:var(--primary-color)">${data.menu.join(' / ')}</div>
                        <button class="done-btn" onclick="completeCall('${id}')">対応完了</button>
                    `;
                    board.insertBefore(card, board.firstChild);

                    // 通知音再生 ＋ デスクトップ(バックグラウンド)通知表示
                    if (data.priority === 'urgent') {
                        urgentAudio.play().catch(() => {});
                        document.getElementById('stop-alarm-btn').style.display = 'block';
                        sendDesktopNotification('🚨 緊急コール', `${data.room}から緊急の呼び出しです`);
                    } else {
                        normalAudio.play().catch(() => {});
                        sendDesktopNotification('🔔 呼び出し', `${data.room}: ${data.menu.join(' / ')}`);
                    }
                }
                if (change.type === "removed") {
                    const card = document.getElementById(`card-${id}`);
                    if (card) card.remove();
                }
            });
        });
    };
</script>
</body>
</html>
